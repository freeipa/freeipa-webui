---
- name: Deploy IPA server for WebUI development
  hosts: ipaserver
  gather_facts: true
  become: true

  tasks:
    - name: Install IPA server
      ansible.builtin.command:
        cmd: >-
          ipa-server-install -U
          --realm={{ ipaserver_realm }}
          --domain={{ ipaserver_domain }}
          --hostname={{ ipaserver_hostname }}
          --admin-password={{ ipaadmin_password }}
          --ds-password={{ ipadm_password }}
          --idstart={{ ipaserver_idstart | default(10000) }}
          --idmax={{ ipaserver_idmax | default(199999) }}
          {% if ipaserver_rid_base is defined %}--rid-base={{ ipaserver_rid_base }}{% endif %}
          {% if ipaserver_secondary_rid_base is defined %}--secondary-rid-base={{ ipaserver_secondary_rid_base }}{% endif %}
          {% if ipaserver_setup_dns | default(false) | bool %}--setup-dns{% endif %}
          {% if ipaserver_auto_forwarders | default(false) | bool %}--auto-forwarders{% endif %}
          {% if ipaserver_auto_reverse | default(false) | bool %}--auto-reverse{% endif %}
          {% if ipaserver_no_dnssec_validation | default(false) | bool %}--no-dnssec-validation{% endif %}
          {% if ipaserver_forward_policy is defined %}--forward-policy={{ ipaserver_forward_policy }}{% endif %}
          {% if ipaserver_setup_kra | default(false) | bool %}--setup-kra{% endif %}
          {% if ipaserver_setup_adtrust | default(false) | bool %}--setup-adtrust{% endif %}
          {% if ipaserver_netbios_name is defined %}--netbios-name={{ ipaserver_netbios_name }}{% endif %}
          {% if ipaserver_no_host_dns | default(false) | bool %}--no-host-dns{% endif %}
          {% if ipaclient_no_ntp | default(false) | bool %}--no-ntp{% endif %}
        creates: /etc/ipa/default.conf
      timeout: 900

- name: Configure modern-ui alias in httpd
  hosts: ipaserver
  gather_facts: false
  become: true
  tasks:
    - name: Modify original modern-ui to point to development version
      ansible.builtin.replace:
        path: /etc/httpd/conf.d/ipa.conf
        regexp: "/usr/share/ipa/modern-ui"
        replace: "/webui/dist"
      register: modify_ipa_conf

    - name: Ensure webui is configured in ipa.conf
      when: not modify_ipa_conf.changed
      ansible.builtin.blockinfile:
        path: /etc/httpd/conf.d/ipa.conf
        insertafter: "EOF"
        marker: "# {mark} Webui Development configuration"
        prepend_newline: true
        block: |+
          Alias /ipa/modern-ui "/webui/dist"
          <Directory "/webui/dist">
            SetHandler None
            AllowOverride None
            Satisfy Any
            Require all granted
            RewriteEngine On
            RewriteRule ^(.*)/assets/(.*)$ assets/$2 [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^ index.html [QSA,L]
            Header set Content-Security-Policy ""
          </Directory>

    - name: Temporary fix for CryptographyDeprecationWarning
      ansible.builtin.replace:
        path: /usr/lib/python3.14/site-packages/ipalib/constants.py
        regexp: '^(\s*)b"\\x00" \* 8\), modes\.CBC\(b"\\x00" \* 8\)\):'
        replace: '\1b"\\x00" * 24), modes.CBC(b"\\x00" * 8)):'

    - name: Override strict CSP in modern-ui block for dev server
      ansible.builtin.replace:
        path: /etc/httpd/conf.d/ipa.conf
        after: "Alias /ipa/modern-ui"
        before: "</Directory>"
        regexp: '^\s*Header set(?:ifempty)? Content-Security-Policy ".*"'
        replace: '  Header set Content-Security-Policy ""'

    - name: Restart web server
      ansible.builtin.systemd_service:
        name: httpd.service
        state: restarted
